<title>UCC Congress Building</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-height viewer with a room directory beside it (below it on phones). */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#15202b; --muted:#56616d; --line:#d8dde4;
  --accent:#c2540a; --accent-ink:#ffffff; --navy:#1f3f8f; --chip:#eceff3; --scene:#dde6ee; --ground:#c9d1c3;
  --hud:rgba(255,255,255,.92); --flag:#fff2e3; --flag-ink:#6b3300;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141b; --panel:#151d26; --ink:#e8edf2; --muted:#9ba7b3; --line:#28333f;
    --accent:#f08a3c; --accent-ink:#1a1209; --navy:#8fb0ff; --chip:#202b37; --scene:#18212b; --ground:#222c27;
    --hud:rgba(21,29,38,.92); --flag:#3a2610; --flag-ink:#ffd9b0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#151d26; --ink:#e8edf2; --muted:#9ba7b3; --line:#28333f;
  --accent:#f08a3c; --accent-ink:#1a1209; --navy:#8fb0ff; --chip:#202b37; --scene:#18212b; --ground:#222c27;
  --hud:rgba(21,29,38,.92); --flag:#3a2610; --flag-ink:#ffd9b0; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.stage{position:relative;min-width:0;min-height:0;background:var(--scene);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.hud.top{top:12px}
.hud.bottom{bottom:44px}
.grp{display:flex;align-items:center;gap:8px;background:var(--hud);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px}
.gl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:2px}
.seg button,.tool{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.seg button:hover,.tool:hover{background:var(--chip)}
.seg button[aria-pressed="true"],.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool{background:var(--hud);border-color:var(--line);padding:6px 11px}
.ex{display:flex;align-items:center;gap:8px;background:var(--hud);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px}
.ex input{width:96px;accent-color:var(--accent)}
.hint{position:absolute;left:16px;right:16px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:5px;white-space:nowrap;transform:translate(12px,12px);z-index:3}
.pad{position:absolute;right:16px;bottom:44px;display:grid;grid-template-columns:repeat(3,44px);gap:6px;z-index:2}
.pad button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--hud);font-size:16px;cursor:pointer;touch-action:none;user-select:none}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.side{min-width:0;min-height:0;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.side h1{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.side header p{margin:0;color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.card h2{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;margin:0 0 2px;text-wrap:balance}
.card .mid{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 8px}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .flag{margin:10px 0 0;padding:7px 9px;border-radius:6px;background:var(--flag);color:var(--flag-ink);font-size:12.5px}
.card .empty{color:var(--muted);font-size:13px;margin:0}
.search input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#list h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;font-weight:600}
#list h3:first-child{margin-top:0}
.rb{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 8px;cursor:pointer}
.rb:hover{background:var(--chip)}
.rb[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.rn{min-width:0}
.rc{font-family:var(--f-mono);font-size:12px;opacity:.8;flex:none}
.none{color:var(--muted);font-size:13px}
details{border-top:1px solid var(--line);padding-top:10px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
details ul{padding-left:18px;margin:8px 0 0}
details li{margin:3px 0}
textarea{width:100%;box-sizing:border-box;margin:8px 0;font-family:var(--f-mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 12px;cursor:pointer}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56%) minmax(0,44%)}
  .side{border-left:0;border-top:1px solid var(--line)}
  .hud.bottom{bottom:36px}
  .hint{font-size:11px}
  .gl{display:none}
  .grp{padding:3px 4px}
  .seg button,.tool{padding:4px 7px;font-size:12px}
  .pad{bottom:36px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Embedded in the website: no side panel, flat orange and flat black, theme set by the page. */
body.embed .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body.embed .side{display:none}
:root[data-theme="dark"].emb{--bg:#141414;--panel:#1a1a1a;--ink:#f2f2f2;--muted:#a3a3a3;--line:#2e2e2e;--accent:#ff7a1a;--accent-ink:#111111;--navy:#ff9a4d;--chip:#242424;--scene:#161616;--ground:#202020;--hud:rgba(26,26,26,.94)}
:root[data-theme="light"].emb{--bg:#e6e7ea;--panel:#e6e7ea;--ink:#171717;--muted:#555;--line:#c9cbd0;--accent:#e8610a;--accent-ink:#ffffff;--navy:#b84a00;--chip:#d9dbe0;--scene:#e0e2e7;--ground:#c9ccd2;--hud:rgba(236,237,241,.94)}
body.embed .grp,body.embed .tool,body.embed .ex{box-shadow:none}
/* Side rails: icons only; names appear when the stage is wide (full screen). */
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hud.top{left:12px;right:auto}
.rail{position:absolute;display:flex;flex-direction:column;gap:6px;z-index:2}
.rail.l{left:12px;top:58px}
.rail.r{right:12px;top:12px;align-items:flex-end}
.rail .tool{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px;min-width:34px;white-space:nowrap}
.rail .tl{display:none;font-size:13px}
.wide .rail .tl{display:inline}
.wide .rail .tool{justify-content:flex-start;padding:7px 12px 7px 9px}
.rail.r .seg{flex-direction:column;background:var(--hud);border:1px solid var(--line);border-radius:8px;padding:3px}
.rail.r .seg button{padding:6px 8px;min-width:34px;font-size:12.5px}
.exw{position:relative}
.expop{position:absolute;left:calc(100% + 8px);top:0;white-space:nowrap;z-index:4}
.stairbox{position:absolute;right:16px;bottom:132px;display:flex;flex-direction:column;gap:6px;z-index:2}
.stairbox button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--hud);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.stairbox button:hover{background:var(--chip)}
.pad{bottom:36px}
.fcard{position:absolute;right:64px;top:12px;width:250px;background:var(--hud);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:3}
.wide .fcard{right:150px}
.narrow .fcard{left:56px;right:56px;top:auto;bottom:34px;width:auto}
.fcard h2{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;margin:0}
.fcard .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fcard .fm{margin:2px 0 0;font-size:12px;color:var(--muted)}
.fcard .x{border:0;background:transparent;cursor:pointer;padding:3px;border-radius:4px;color:var(--muted)}
.fcard .x:hover{background:var(--chip);color:var(--ink)}
.fcard .pill{display:inline-block;margin:8px 0 6px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.fcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:8px 0 0;font-size:12.5px}
.fcard .pill+dl{margin-top:0}
.fcard dt{color:var(--muted)}
.fcard dd{margin:0}
.fcard .go{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.fcard .go:hover{border-color:var(--accent)}
@media (max-width:760px){.pad{bottom:36px}.stairbox{bottom:132px}}
</style>

<script>
(function(){
'use strict';
/* ---------- Constants. Plan pixels (2135 x 1736) convert at S metres per pixel. ---------- */
var S=0.0125,PW=2135,PH=1736,W=PW*S,D=PH*S,G=12,H=4,SL=0.3,T=0.25,WH=H-SL,DH=2.2,HH=5;
var WING={L:'Left building',R:'Right building'};
var ORD=['','1st','2nd','3rd','4th'];
var FONT='"IBM Plex Sans","Segoe UI",Arial,sans-serif',MONO='"IBM Plex Mono",Consolas,monospace';
function wx(w,px){return w==='L'?-G/2-W+px*S:G/2+px*S;}
function wz(py){return -D/2+py*S;}
function rect(w,a,b,c,d){var p=wx(w,a),q=wx(w,b);return{x0:Math.min(p,q),x1:Math.max(p,q),z0:wz(c),z1:wz(d)};}

/* ---------- Room slots in plan pixels. Left plan = image 3, right plan = image 4. ---------- */
var SLOTS={
  L:{back:[[0,711],[711,1423],[1423,2135]],front:[[0,711],[711,1308]]},
  R:{back:[[0,711],[711,1423],[1423,2135]],front:[[826,1423],[1423,2135]]}
};
/* Door position as a fraction along the room, read from the door swings in the plans. */
var DOORF={L:{back:[.9,.09,.73],front:[.9,.11]},R:{back:[.65,.85,.14],front:[.82,.14]}};

/* Names exactly as printed on the elevations. Index 0 = 1st floor.
   Left/Right is the building as seen from the front. Back rooms are listed outer end to inner end for the
   left building and inner end to outer end for the right building, which is plan pixel order. */
var NAMES={
  L:{
    back:[
      ['Industrial Art Laboratory (108)','Regular Room (107)','Library (106)'],
      ['Chemistry Laboratory (208)','Physics (207)','Lecture (206)'],
      ['Early Childhood Simulator (208)','Regular Room (307)','Regular Room (306)'],
      ['Regular Room (408)','Speech Lab (407)','Regular Room (406)']
    ],
    front:[
      ['Home Economics Laboratory (110)','Regular Room (109)'],
      ['Biology Laboratory (210)','Science Storage Room (209)'],
      ['Regular Room (309)','Regular Room (309)'],
      ['Multi Media Room (210)','Science Storage Room (409)']
    ]
  },
  R:{
    back:[
      ['Registrar','Record Section','Clinic & Guidance'],
      ['Chemistry Laboratory (205)','Bartending Laboratory (204)','Kitchen (203)'],
      ['MIS Office (305)','Multimedia Laboratory (304)','CSD COMLAB (303)'],
      ['Lecture (405)','Regular Room (404)','Regular Room (403)']
    ],
    front:[
      ["President's Office",'IT Center'],
      ['Regular Room (201)','Regular Room (202)'],
      ['CSD COMLAB (301)','CSD COMLAB (302)'],
      ['Regular Room (401)','Regular Room (402)']
    ]
  }
};

var KIND={
  classroom:{n:'Regular classroom',c:'#d9dde3'},
  lecture:{n:'Lecture or speech room',c:'#d3e2f2'},
  lab:{n:'Laboratory or specialty room',c:'#f0d8bd'},
  storage:{n:'Storage room',c:'#dcd5c5'},
  office:{n:'Office or service',c:'#d2e5d5'},
  library:{n:'Library',c:'#e4d4ee'},
  hall:{n:'Social Hall',c:'#ddd8cc'}
};
function kindOf(n){
  if(/Library/.test(n))return 'library';
  if(/Storage/.test(n))return 'storage';

    mouse.x=e.clientX;mouse.y=e.clientY;needPick=true;
  });
  cv.addEventListener('pointerleave',function(){$('tip').hidden=true;needPick=false;});
  window.addEventListener('keydown',function(e){if(!st.walk||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;var k0=e.key.length===1?e.key.toLowerCase():e.key;if(k0==='e'||k0==='PageUp')startClimb(1);if(k0==='q'||k0==='PageDown')startClimb(-1);walk.keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault();});
  window.addEventListener('keyup',function(e){walk.keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
  Array.prototype.forEach.call($('pad').querySelectorAll('button'),function(b){
    var k=b.dataset.k;
    b.addEventListener('pointerdown',function(e){e.preventDefault();walk.pad[k]=true;});
    ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){walk.pad[k]=false;});});
  });
}

var last=performance.now(),v3=new THREE.Vector3();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(tw){
    var k=Math.min(1,(now-tw.t0)/tw.d),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0v,tw.t1,e);if(k>=1)tw=null;
  }
  if(st.walk)stepWalk(dt);else controls.update();
  if(routeTex.length){var o=-((now*0.0009)%1);routeTex.forEach(function(t){t.offset.x=o;});}
  if(routeRing){var kr=1+0.18*Math.sin(now*0.005);routeRing.scale.set(kr,1,kr);}
  if(outline&&st.sel){st.sel.pick.getWorldPosition(v3);outline.position.copy(v3);outline.visible=vis(st.sel.pick);}
  extra.forEach(function(e){e.room.pick.getWorldPosition(v3);e.line.position.copy(v3);e.line.visible=vis(e.room.pick);});
  if(needPick&&!st.walk){
    needPick=false;var r=pickAt(mouse.x,mouse.y),tip=$('tip');
    if(r){var b=stage.getBoundingClientRect();tip.textContent=r.label+(r.code?' ('+r.code+')':'');tip.style.left=(mouse.x-b.left)+'px';tip.style.top=(mouse.y-b.top)+'px';tip.hidden=false;renderer.domElement.style.cursor='pointer';}
    else{tip.hidden=true;renderer.domElement.style.cursor='';}
  }
  renderer.render(scene,camera);
}

/* ---------- Embedded mode: the website drives status colours, selection and theme through postMessage ---------- */
var EMBED=/[?&]embed=1/.test(location.search),extra=[];
var SCOL={free:0x2fb35f,occupied:0xff7a1a,maintenance:0xd9a400,inactive:0x3a3a3a};
function clearExtra(){extra.forEach(function(e){scene.remove(e.line);e.line.geometry.dispose();});extra=[];}
function addExtra(r){
  var geo=r.pick.geometry.parameters;
  var line=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(geo.width,geo.height,geo.depth)),new THREE.LineBasicMaterial({color:0xffffff,depthTest:false}));
  line.renderOrder=998;scene.add(line);extra.push({line:line,room:r});
  if(r.tile){r.tile.material.opacity=1;}
}
function byId(id){for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].id===id)return ROOMS[i];return null;}
function paintStatus(map){
  ROOMS.forEach(function(r){
    var s=map&&map[r.id];r.status=s||null;
    if(!r.tile)return;
    if(s&&SCOL[s]!==undefined){r.tile.userData.base.setHex(SCOL[s]);r.tile.userData.op=0.88;}
    else{r.tile.userData.base.set(0x2a2a2a);r.tile.userData.op=0.55;}
  });
  setOutline(st.sel);
}
function applySelection(ids,view){
  var rooms=(ids||[]).map(byId).filter(Boolean);
  if(!rooms.length){select(null,{silent:true});return;}
  select(rooms[0],{view:!!view,silent:true});
  rooms.slice(1).forEach(addExtra);
}
function setEmbedTheme(t){
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');
  if(window.__groundMat){var c=getComputedStyle(document.documentElement).getPropertyValue('--ground').trim();if(c)window.__groundMat.color.set(c);}
}
function initEmbed(){
  document.body.classList.add('embed');document.documentElement.classList.add('emb');
  var m=location.search.match(/[?&]theme=(light|dark)/);setEmbedTheme(m?m[1]:'dark');
  st.xray=true;applyView();
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin)return;
    var d=e.data||{};
    if(d.type==='ucc:status')paintStatus(d.rooms||{});
    else if(d.type==='ucc:select')applySelection(d.ids,d.view);
    else if(d.type==='ucc:theme')setEmbedTheme(d.theme);
    else if(d.type==='ucc:info'){INFO=d.info||null;renderFloat();}
    else if(d.type==='ucc:fsstate')setFullIcon(!!d.on);
  });
  if(window.parent!==window)window.parent.postMessage({type:'ucc:ready'},location.origin);
}

function start(){
  var ok=initGL();
  if(ok){buildAll();applyTheme();fit();}
  else{ROOMS.forEach(function(r){});}
  $('hint').textContent=HINT;
  $('notes').textContent='';NOTES.forEach(function(n){var li=document.createElement('li');li.textContent=n;$('notes').appendChild(li);});
  $('json').value=JSON.stringify(ROOMS.map(function(r){return{id:r.id,name:r.name,code:r.code||null,building:WING[r.wing],floor:r.floor,faces:r.side==='front'?'front':'back',type:KIND[r.kind].n};}).concat([{id:'HALL',name:'Social Hall',code:null,building:'Both',floor:'above 4th',faces:null,type:KIND.hall.n}]),null,1);
  renderList('');renderCard();bind();if(EMBED&&ok)initEmbed();
  if(ok){
    applyView();
    window.addEventListener('resize',fit);
    if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);
    new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
    requestAnimationFrame(loop);
  }else{
    ['bReset','bFront','bBack','bTop','bXray','bLab','bRoute','bWalk','bEx','bFull','rEx','segB','segF'].forEach(function(i){var e=$(i);if(e&&e.tagName==='BUTTON')e.disabled=true;});
  }
  window.__ucc={st:st,ROOMS:ROOMS,select:select,applyView:applyView,blocked:blocked,walk:walk,stairRect:stairRect,stairSpot:stairSpot,enterWalk:enterWalk,startClimb:startClimb,stepWalk:stepWalk,ZC1:ZC1,ZC2:ZC2,routeCount:function(){return routeObjs.length;},camera:function(){return camera;}};
}
var fp=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1500);})]):Promise.resolve();
fp.then(start,start);
})();
</script>
